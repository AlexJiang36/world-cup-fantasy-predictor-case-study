<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">World Cup Fantasy Predictor system architecture</title>
  <desc id="desc">A layered diagram from live sources through canonical state, prediction services, snapshots, decision workflows, APIs, frontend, evaluation and operations.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 16; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; rx: 22; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .label { font: 600 20px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 400 16px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#374151"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1360" height="740" class="group"/>
  <text x="700" y="60" class="title" text-anchor="middle">World Cup Fantasy Predictor — System Overview</text>

  <rect x="70" y="115" width="220" height="100" class="box"/>
  <text x="180" y="155" class="label">Live Sources</text>
  <text x="180" y="185" class="small">fixtures, results, players</text>

  <rect x="350" y="115" width="240" height="100" class="box"/>
  <text x="470" y="155" class="label">Ingestion</text>
  <text x="470" y="185" class="small">normalize and validate</text>

  <rect x="650" y="115" width="260" height="100" class="box"/>
  <text x="780" y="155" class="label">Canonical State</text>
  <text x="780" y="185" class="small">PostgreSQL + contracts</text>

  <rect x="970" y="115" width="260" height="100" class="box"/>
  <text x="1100" y="155" class="label">Lifecycle Control</text>
  <text x="1100" y="185" class="small">active / closeout / complete</text>

  <path d="M290 165 L350 165" class="arrow"/>
  <path d="M590 165 L650 165" class="arrow"/>
  <path d="M910 165 L970 165" class="arrow"/>

  <rect x="180" y="300" width="280" height="120" class="box"/>
  <text x="320" y="340" class="label">Match Services</text>
  <text x="320" y="372" class="small">outcomes, probabilities, scorelines</text>

  <rect x="560" y="300" width="280" height="120" class="box"/>
  <text x="700" y="340" class="label">Player Services</text>
  <text x="700" y="372" class="small">minutes, fantasy points, ranking</text>

  <rect x="940" y="300" width="280" height="120" class="box"/>
  <text x="1080" y="340" class="label">Decision Services</text>
  <text x="1080" y="372" class="small">squad, transfers, constraints</text>

  <path d="M780 215 L320 300" class="arrow"/>
  <path d="M780 215 L700 300" class="arrow"/>
  <path d="M780 215 L1080 300" class="arrow"/>

  <rect x="110" y="510" width="280" height="120" class="box"/>
  <text x="250" y="550" class="label">Frozen Snapshots</text>
  <text x="250" y="582" class="small">pre-match provenance</text>

  <rect x="470" y="510" width="240" height="120" class="box"/>
  <text x="590" y="550" class="label">Evaluation</text>
  <text x="590" y="582" class="small">metrics and governance</text>

  <rect x="790" y="510" width="220" height="120" class="box"/>
  <text x="900" y="550" class="label">FastAPI</text>
  <text x="900" y="582" class="small">product and ops APIs</text>

  <rect x="1090" y="510" width="220" height="120" class="box"/>
  <text x="1200" y="550" class="label">Next.js</text>
  <text x="1200" y="582" class="small">product dashboards</text>

  <path d="M320 420 L250 510" class="arrow"/>
  <path d="M700 420 L250 510" class="arrow"/>
  <path d="M250 630 L590 630" class="arrow"/>
  <path d="M710 570 L790 570" class="arrow"/>
  <path d="M1080 420 L900 510" class="arrow"/>
  <path d="M1010 570 L1090 570" class="arrow"/>

  <text x="700" y="705" class="small">Timestamped artifacts, registries, manifests, validation and checksums support every layer.</text>
</svg>
